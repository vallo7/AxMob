name: Unpack
# Dépose un .zip à la racine du dépôt (ou dans incoming/) : ce workflow le
# décompresse, commite les fichiers sur la même branche, puis supprime l'archive.
#
# Archive trop lourde pour l'envoi par navigateur (25 Mo par fichier) ? Elle est
# livrée en plusieurs parties nommées  <nom>-part<N>of<M>.zip
# (ex. axmob-phase6-part1of2.zip + axmob-phase6-part2of2.zip). Dépose-les toutes,
# de préférence en un seul envoi. Tant que les M parties ne sont pas toutes
# présentes, aucune n'est décompressée (le dépôt n'est jamais dans un état
# à moitié mis à jour) ; dès qu'elles sont complètes, elles sont fusionnées
# en un seul commit. Chaque partie contient des fichiers distincts.
# Suppressions : une archive peut contenir à sa racine un fichier _delete.txt (un chemin par
# ligne, relatif à la racine du dépôt ; lignes vides et # ignorées). Après la fusion, ces fichiers
# ou dossiers sont supprimés du dépôt (utile quand une phase remplace des fichiers par d'autres
# noms : sans cela, les anciens resteraient). Chemins absolus, « .. », .git et .github/ refusés.
# Lancement manuel possible : onglet Actions > Unpack > Run workflow.
on:
  push:
    paths:
      - "*.zip"
      - "incoming/*.zip"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: unpack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unpack:
    # Ignore le commit de nettoyage produit par ce workflow lui-même.
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(unpack)')
    runs-on: ubuntu-24.04
    env:
      # Secret optionnel : jeton personnel (droits Contents + Workflows en écriture).
      # Avec lui, les fichiers de .github/workflows/ sont poussés et la CI se déclenche.
      HAS_PAT: ${{ secrets.UNPACK_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Dernier état de la branche (et non le commit qui a déclenché le run) :
          # évite de retraiter une archive déjà décompressée par un run précédent.
          ref: ${{ github.ref_name }}
          token: ${{ secrets.UNPACK_TOKEN || github.token }}

      - name: Repérer les archives
        id: find
        run: |
          set -euo pipefail
          shopt -s nullglob
          all=(*.zip incoming/*.zip)
          if [ "${#all[@]}" -eq 0 ]; then
            echo "Aucune archive .zip à la racine ni dans incoming/."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Archives simples d'un côté, archives en parties (<base>-part<N>of<M>.zip) de l'autre.
          re='^(.+)-part([0-9]+)of([0-9]+)\.zip$'
          singles=()
          declare -A total=() seen=() paths=()
          for z in "${all[@]}"; do
            f="$(basename "$z")"
            if [[ "$f" =~ $re ]]; then
              base="${BASH_REMATCH[1]}"
              n=$((10#${BASH_REMATCH[2]}))
              m=$((10#${BASH_REMATCH[3]}))
              if [ "$n" -lt 1 ] || [ "$n" -gt "$m" ]; then
                echo "::error::Numéro de partie hors plage dans $f (attendu de 1 à $m)"; exit 1
              fi
              if [ -n "${total[$base]:-}" ] && [ "${total[$base]}" != "$m" ]; then
                echo "::error::Parties de « $base » incohérentes : total annoncé ${total[$base]} puis $m"; exit 1
              fi
              case " ${seen[$base]:-} " in
                *" $n "*) echo "::error::Partie $n de « $base » présente en double"; exit 1 ;;
              esac
              total[$base]=$m
              seen[$base]="${seen[$base]:-} $n"
              paths[$base]="${paths[$base]:-}$z"$'\n'
            else
              singles+=("$z")
            fi
          done

          sel="$RUNNER_TEMP/zips.txt"      # archives à décompresser maintenant
          names="$RUNNER_TEMP/names.txt"   # libellés pour le commit et le résumé
          : > "$sel"; : > "$names"
          for z in "${singles[@]}"; do
            echo "$z" >> "$sel"
            basename "$z" >> "$names"
          done
          for base in "${!total[@]}"; do
            m="${total[$base]}"
            read -ra got <<< "${seen[$base]}"
            if [ "${#got[@]}" -eq "$m" ]; then
              printf '%s' "${paths[$base]}" >> "$sel"
              echo "$base ($m parties)" >> "$names"
            else
              missing=""
              for ((i = 1; i <= m; i++)); do
                case " ${seen[$base]} " in
                  *" $i "*) ;;
                  *) missing+="$i " ;;
                esac
              done
              msg="« $base » : ${#got[@]}/$m parties reçues (manquantes : ${missing% }). Rien n'est décompressé tant qu'il en manque."
              echo "::notice::$msg"
              echo "> ⏳ $msg" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

          if [ ! -s "$sel" ]; then
            echo "Aucune archive complète à traiter pour l'instant."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sort -V -o "$sel" "$sel"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "Archives à traiter :"; cat "$sel"

      - name: Décompresser
        if: steps.find.outputs.found == 'true'
        run: |
          set -euo pipefail
          # Fichiers parasites jamais extraits (macOS, Windows, sauvegardes Blender, .git).
          EXCL=('*__MACOSX/*' '*/.DS_Store' '.DS_Store' '*/Thumbs.db' 'Thumbs.db' '*.blend1' '.git/*' '*/.git/*')
          while IFS= read -r z; do
            echo "::group::$z"
            unzip -tq "$z" > /dev/null || { echo "::error::Archive corrompue : $z"; exit 1; }
            if unzip -Z1 "$z" | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
              echo "::error::Chemin dangereux dans $z (absolu ou contenant « .. »)"; exit 1
            fi

            # 1) Extraction dans un dossier temporaire (jamais directement dans le dépôt).
            stage="$(mktemp -d "$RUNNER_TEMP/stage.XXXXXX")"
            # (les avertissements « excluded filename not matched » sont filtrés)
            unzip -o -q "$z" -x "${EXCL[@]}" -d "$stage" 2> >(grep -v 'not matched' >&2)

            # 2) Si l'archive contient un unique dossier racine portant le nom de l'archive
            #    (ex. axmob-phase4.zip -> axmob-phase4/), on le retire : son contenu
            #    est fusionné à la racine du dépôt au lieu de créer un sous-dossier.
            #    Pour une archive en parties, le nom retenu est celui sans « -partNofM »
            #    (axmob-phase6-part1of2.zip -> axmob-phase6/).
            base="$(basename "$z" .zip)"
            if [[ "$base" =~ ^(.+)-part[0-9]+of[0-9]+$ ]]; then
              base="${BASH_REMATCH[1]}"
            fi
            root="$stage"
            mapfile -t tops < <(find "$stage" -mindepth 1 -maxdepth 1 -printf '%f\n')
            if [ "${#tops[@]}" -eq 1 ] && [ -d "$stage/${tops[0]}" ] \
               && { [ "${tops[0]}" = "$base" ] || [[ "${tops[0]}" == axmob-phase* ]]; }; then
              root="$stage/${tops[0]}"
              echo "Dossier racine « ${tops[0]}/ » retiré : contenu fusionné à la racine du dépôt."
            fi

            # 3) Le jeton par défaut n'a pas le droit de modifier .github/workflows/ :
            #    on garde ces fichiers à part, hors de .github/, pour les déplacer à la main.
            if [ "$HAS_PAT" != "true" ] && [ -d "$root/.github/workflows" ]; then
              mkdir -p pending-workflows
              cp -a "$root/.github/workflows/." pending-workflows/
              rm -rf "$root/.github/workflows"
            fi

            # 4) Fusion dans le dépôt : les fichiers existants sont écrasés, les autres conservés.
            #    Le manifeste _delete.txt n'est pas copié : il est lu puis appliqué après la fusion
            #    de TOUTES les parties (une partie ne peut donc pas supprimer le contenu d'une autre).
            if [ -f "$root/_delete.txt" ]; then
              cat "$root/_delete.txt" >> "$RUNNER_TEMP/deletions.txt"
              printf '\n' >> "$RUNNER_TEMP/deletions.txt"
              rm -f "$root/_delete.txt"
            fi
            cp -a "$root/." .
            rm -rf "$stage"
            rm -f -- "$z"
            echo "::endgroup::"
          done < "$RUNNER_TEMP/zips.txt"
          # Suppressions demandées par les archives (_delete.txt), après toutes les fusions.
          if [ -s "$RUNNER_TEMP/deletions.txt" ]; then
            echo "::group::Suppressions demandées"
            while IFS= read -r line || [ -n "$line" ]; do
              line="${line%$'\r'}"
              line="$(printf '%s' "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              case "$line" in ''|'#'*) continue ;; esac
              if [[ "$line" == /* || "$line" == ".." || "$line" == ../* || "$line" == */../* || "$line" == */.. \
                    || "$line" == .git || "$line" == .git/* || "$line" == .github || "$line" == .github/* \
                    || "$line" == "." || "$line" == "./" ]]; then
                echo "::warning::Suppression refusée (chemin non autorisé) : $line"
                continue
              fi
              if [ -e "$line" ] || [ -L "$line" ]; then
                rm -rf -- "$line"
                echo "supprimé : $line"
              else
                echo "déjà absent : $line"
              fi
            done < "$RUNNER_TEMP/deletions.txt"
            echo "::endgroup::"
          fi
          # Scripts shell exécutables, dossiers vides conservés par git.
          find . -name '*.sh' -not -path './.git/*' -exec chmod +x {} +
          find . -type d -empty -not -path './.git/*' -exec touch {}/.gitkeep \;

      - name: Commiter et pousser
        if: steps.find.outputs.found == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Rien à commiter."; exit 0
          fi
          names=$(paste -sd',' "$RUNNER_TEMP/names.txt" | sed 's/,/, /g')
          git commit -q -m "chore(unpack): ${names}"
          {
            echo "### Unpack"
            echo "Archives : \`${names}\`"
            echo '```'
            git show --shortstat --format= HEAD
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git show --stat=100 --format= HEAD
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Avertir si les workflows n'ont pas pu être poussés
        if: steps.find.outputs.found == 'true' && env.HAS_PAT != 'true'
        run: |
          if [ -d pending-workflows ]; then
            msg="Les workflows de l'archive sont dans pending-workflows/ : le jeton par défaut ne peut pas écrire dans .github/workflows/. Déplace-les à la main, ou ajoute le secret UNPACK_TOKEN."
            echo "::warning::$msg"
            echo "> ⚠️ $msg" >> "$GITHUB_STEP_SUMMARY"
          fi
