name: Blender export
on:
  workflow_dispatch:
  push:
    paths: ["blender/source/**"]
jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - name: Installer bpy (module pip, headless)
        run: pip install bpy==5.2.3 pillow
      - name: Exécuter les scripts de modélisation
        run: |
          # lib/ (bibliothèque ax.py) est un sous-dossier : seuls les scripts d'asset sont lancés.
          # Chaque script écrit blender/export/*.glb|.blend et assets/models/*.glb ; l'arène écrit
          # aussi assets/textures/sand.png, water_texture.py assets/textures/water_noise.png (sans bpy),
          # et la bibliothèque assets/textures/palette.png.
          for f in blender/source/*.py; do echo "== $f"; python "$f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: glb-exports
          path: |
            blender/export/*.glb
            blender/export/*.blend
            assets/textures/*.png
