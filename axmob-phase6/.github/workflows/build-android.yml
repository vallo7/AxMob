name: Build Android
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
env:
  GODOT_VERSION: "4.7.2"
jobs:
  apk-debug:
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      # Le paquet « tools » n'existe plus dans le dépôt SDK : on ne demande aucun paquet à l'action,
      # scripts/ci/setup_android.sh installe tout ce dont Godot a besoin.
      - uses: android-actions/setup-android@v3
        with: { packages: "" }
      - name: Installer Godot et templates
        run: INSTALL_TEMPLATES=1 scripts/ci/setup_godot.sh
      - name: Préparer le build Android
        run: scripts/ci/setup_android.sh
      - name: Version code
        run: sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
      - name: Importer et exporter l'APK debug
        run: |
          godot --headless --import
          mkdir -p build
          godot --headless --export-debug "Android" build/axmob-debug.apk
      # Phase 4 : le « rien ne vibre » de la phase 3 doit pouvoir être éliminé objectivement.
      # La permission VIBRATE est lue DANS l'APK produit ; le build échoue si elle manque.
      - name: Vérifier les permissions de l'APK (VIBRATE obligatoire)
        run: |
          AAPT2="$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          "$AAPT2" dump permissions build/axmob-debug.apk | tee build/permissions.txt
          grep -q "android.permission.VIBRATE" build/permissions.txt \
            || { echo "::error::permission VIBRATE absente de l'APK"; exit 1; }
      # Phase 6 : démarrage BLANC (plus de flash noir / logo Godot). Le thème Android est généré par
      # l'export : on relit la couleur du fond de démarrage et on la tient pour fausse si elle n'est
      # pas blanche. Avertissement (pas d'échec) : un téléphone reste la vérification définitive.
      - name: Vérifier l'écran de démarrage blanc
        run: |
          grep -rn "windowSplashScreenBackground\|windowBackground" android/build/res/values*/ | tee build/splash_theme.txt || true
          if grep -qi "ffffff" build/splash_theme.txt; then
            echo "Fond de démarrage blanc : OK"
          else
            echo "::warning::fond de démarrage Android non blanc dans le thème généré (voir build/splash_theme.txt)"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: axmob-debug-apk
          path: |
            build/axmob-debug.apk
            build/permissions.txt
            build/splash_theme.txt
  aab-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      # Le paquet « tools » n'existe plus dans le dépôt SDK : on ne demande aucun paquet à l'action,
      # scripts/ci/setup_android.sh installe tout ce dont Godot a besoin.
      - uses: android-actions/setup-android@v3
        with: { packages: "" }
      - name: Installer Godot et templates
        run: INSTALL_TEMPLATES=1 scripts/ci/setup_godot.sh
      - name: Préparer le build Android
        run: scripts/ci/setup_android.sh
      - name: Version
        run: |
          sed -i "s/^version\/code=.*/version\/code=${{ github.run_number }}/" export_presets.cfg
          sed -i "s/^version\/name=.*/version\/name=\"${GITHUB_REF_NAME#v}\"/" export_presets.cfg
      - name: Keystore release (Secrets)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$HOME/release.keystore"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/release.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=${{ secrets.ANDROID_KEYSTORE_USER }}" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
      - name: Exporter l'AAB signé
        run: |
          godot --headless --import
          mkdir -p build
          godot --headless --export-release "Android AAB" build/axmob.aab
      - uses: actions/upload-artifact@v4
        with: { name: axmob-aab, path: build/axmob.aab }
